<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InstaForm</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2L4.09 12.11a1 1 0 0 0-.09 1.1L7 19h10l3-5.79a1 1 0 0 0-.09-1.1L13 2Z" fill="#818CF8"/>
          <path d="M13 2v17H7l-3-5.79a1 1 0 0 1 .09-1.1L13 2Z" fill="#4F46E5"/>
          <line x1="8" y1="19" x2="8" y2="22" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
          <line x1="16" y1="19" x2="16" y2="22" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">InstaForm</span>
      </div>
      <button id="fill-btn" class="btn btn-primary">
        <svg viewBox="0 0 16 16" fill="none" class="btn-icon">
          <path d="M3 8h10M8 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Fill Page
      </button>
    </header>

    <!-- Tabs -->
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="personal"      role="tab">Personal</button>
      <button class="tab"        data-tab="professional"  role="tab">Work</button>
      <button class="tab"        data-tab="academic"      role="tab">Education</button>
      <button class="tab"        data-tab="media"         role="tab">Online</button>
    </nav>

    <!-- Scrollable content area -->
    <main class="content">

      <!-- ── Personal ─────────────────────────────────────────────────── -->
      <section id="tab-personal" class="tab-panel active">

        <div class="section-title">Identity</div>
        <div class="form-row">
          <div class="field">
            <label>First Name</label>
            <input type="text" id="p-firstName" autocomplete="off" placeholder="Jane" />
          </div>
          <div class="field">
            <label>Last Name</label>
            <input type="text" id="p-lastName" autocomplete="off" placeholder="Doe" />
          </div>
        </div>
        <div class="field">
          <label>Full Name <span class="hint">(leave blank to auto-combine)</span></label>
          <input type="text" id="p-fullName" autocomplete="off" placeholder="Jane Doe" />
        </div>
        <div class="form-row">
          <div class="field">
            <label>Email</label>
            <input type="email" id="p-email" autocomplete="off" placeholder="jane@example.com" />
          </div>
          <div class="field">
            <label>Phone</label>
            <input type="tel" id="p-phone" autocomplete="off" placeholder="+1 555 000 0000" />
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Date of Birth</label>
            <input type="date" id="p-dob" />
          </div>
          <div class="field">
            <label>Gender</label>
            <select id="p-gender">
              <option value="">— select —</option>
              <option>Male</option>
              <option>Female</option>
              <option>Non-binary</option>
              <option>Prefer not to say</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Nationality</label>
          <input type="text" id="p-nationality" autocomplete="off" placeholder="e.g. American" />
        </div>

        <div class="section-title" style="margin-top:16px">Address</div>
        <div class="field">
          <label>Street</label>
          <input type="text" id="p-street" autocomplete="off" placeholder="123 Main St" />
        </div>
        <div class="form-row">
          <div class="field">
            <label>City</label>
            <input type="text" id="p-city" autocomplete="off" placeholder="San Francisco" />
          </div>
          <div class="field">
            <label>State / Province</label>
            <input type="text" id="p-state" autocomplete="off" placeholder="CA" />
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>ZIP / Postal Code</label>
            <input type="text" id="p-zip" autocomplete="off" placeholder="94103" />
          </div>
          <div class="field">
            <label>Country</label>
            <input type="text" id="p-country" autocomplete="off" placeholder="United States" />
          </div>
        </div>

      </section>

      <!-- ── Professional ──────────────────────────────────────────────── -->
      <section id="tab-professional" class="tab-panel hidden">
        <div id="pro-entries"></div>
        <button class="btn btn-ghost add-btn" data-type="pro">
          <svg viewBox="0 0 16 16" fill="none" class="btn-icon">
            <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Add Job
        </button>
      </section>

      <!-- ── Academic ──────────────────────────────────────────────────── -->
      <section id="tab-academic" class="tab-panel hidden">
        <div id="edu-entries"></div>
        <button class="btn btn-ghost add-btn" data-type="edu">
          <svg viewBox="0 0 16 16" fill="none" class="btn-icon">
            <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Add Degree
        </button>
      </section>

      <!-- ── Media / Online ────────────────────────────────────────────── -->
      <section id="tab-media" class="tab-panel hidden">

        <div class="section-title">Social &amp; Online</div>
        <div class="field icon-field">
          <label>LinkedIn URL</label>
          <input type="url" id="m-linkedin" autocomplete="off" placeholder="https://linkedin.com/in/janedoe" />
        </div>
        <div class="field icon-field">
          <label>GitHub URL</label>
          <input type="url" id="m-github" autocomplete="off" placeholder="https://github.com/janedoe" />
        </div>
        <div class="field icon-field">
          <label>Twitter / X Handle</label>
          <input type="text" id="m-twitter" autocomplete="off" placeholder="@janedoe" />
        </div>
        <div class="field icon-field">
          <label>Portfolio / Website</label>
          <input type="url" id="m-portfolio" autocomplete="off" placeholder="https://janedoe.dev" />
        </div>

        <div class="section-title" style="margin-top:16px">Images</div>
        <div class="form-row image-row">
          <div class="image-upload-block">
            <span class="image-label">Profile Photo</span>
            <label class="image-drop" id="photo-drop" for="m-photo-file">
              <img id="photo-preview" class="image-preview hidden" alt="photo preview" />
              <span class="image-placeholder" id="photo-placeholder">
                <svg viewBox="0 0 24 24" fill="none" width="28" height="28">
                  <circle cx="12" cy="8" r="4" stroke="#818CF8" stroke-width="1.5"/>
                  <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span>Upload</span>
              </span>
            </label>
            <input type="file" id="m-photo-file" accept="image/*" class="hidden" />
            <button class="btn btn-ghost btn-xs" id="photo-clear" style="display:none">Remove</button>
          </div>
          <div class="image-upload-block">
            <span class="image-label">Signature</span>
            <label class="image-drop" id="sig-drop" for="m-sig-file">
              <img id="sig-preview" class="image-preview hidden" alt="signature preview" />
              <span class="image-placeholder" id="sig-placeholder">
                <svg viewBox="0 0 24 24" fill="none" width="28" height="28">
                  <path d="M3 18c2-4 4-7 6-7s2 4 4 4 4-8 6-8" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Upload</span>
              </span>
            </label>
            <input type="file" id="m-sig-file" accept="image/*" class="hidden" />
            <button class="btn btn-ghost btn-xs" id="sig-clear" style="display:none">Remove</button>
          </div>
        </div>

      </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
      <span id="save-status" class="save-status"></span>
      <button id="save-btn" class="btn btn-primary">Save Profile</button>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
