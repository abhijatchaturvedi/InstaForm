<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>InstaForm</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Shown while checking Chrome profile (and as error state) -->
  <div id="screen-auth" class="screen">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none">
        <path d="M13 2L4.09 12.11a1 1 0 0 0-.09 1.1L7 19h10l3-5.79a1 1 0 0 0-.09-1.1L13 2Z" fill="#818CF8"/>
        <path d="M13 2v17H7l-3-5.79a1 1 0 0 1 .09-1.1L13 2Z" fill="#4F46E5"/>
        <line x1="8" y1="19" x2="8" y2="22" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
        <line x1="16" y1="19" x2="16" y2="22" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">InstaForm</span>
    </div>

    <!-- Loading (default) -->
    <div id="auth-loading" class="auth-state">
      <div class="spinner"></div>
      <span class="auth-msg">Connecting to Chrome…</span>
    </div>

    <!-- Not signed in to Chrome -->
    <div id="auth-error" class="auth-state hidden">
      <svg viewBox="0 0 20 20" fill="none" width="28" height="28" class="auth-icon">
        <circle cx="10" cy="10" r="8" stroke="#f87171" stroke-width="1.5"/>
        <path d="M10 6v5M10 13.5v.5" stroke="#f87171" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <p class="auth-msg-bold">Not signed in to Chrome</p>
      <p class="auth-hint">
        Sign in to Chrome to use InstaForm.<br/>
        <span class="auth-path">Chrome menu → Settings → Sign in to Chrome</span>
      </p>
      <button id="retry-btn" class="btn btn-secondary">Try again</button>
    </div>
  </div>

  <!-- Main launcher (shown after auth) -->
  <div id="screen-main" class="screen hidden">

    <div class="toprow">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none">
          <path d="M13 2L4.09 12.11a1 1 0 0 0-.09 1.1L7 19h10l3-5.79a1 1 0 0 0-.09-1.1L13 2Z" fill="#818CF8"/>
          <path d="M13 2v17H7l-3-5.79a1 1 0 0 1 .09-1.1L13 2Z" fill="#4F46E5"/>
          <line x1="8" y1="19" x2="8" y2="22" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
          <line x1="16" y1="19" x2="16" y2="22" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">InstaForm</span>
      </div>
    </div>

    <div class="profile-chip">
      <div class="chip-avatar" id="chip-avatar"></div>
      <div class="chip-info">
        <span class="chip-name"  id="chip-name"></span>
        <span class="chip-email" id="chip-email"></span>
      </div>
    </div>

    <button id="fill-btn" class="btn btn-fill">
      <svg viewBox="0 0 20 20" fill="none" width="15" height="15">
        <path d="M4 10h12M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Fill This Page
    </button>

    <p class="shortcut-hint"><kbd>Ctrl+Shift+F</kbd> works on any page</p>

    <div class="divider"></div>

    <button id="edit-btn" class="btn btn-secondary">
      <svg viewBox="0 0 16 16" fill="none" width="12" height="12">
        <path d="M11.7 2.3a1 1 0 0 1 1.4 0l.6.6a1 1 0 0 1 0 1.4L3.5 14.5 1 15l.5-2.5L11.7 2.3Z"
              stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
      Edit Profile
    </button>

  </div>

  <script src="../auth.js"></script>
  <script src="popup.js"></script>
</body>
</html>
