<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>InstaForm</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Sign-in gate (shown until authenticated) ────────────────────── -->
  <div id="screen-signin" class="screen">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none">
        <path d="M13 2L4.09 12.11a1 1 0 0 0-.09 1.1L7 19h10l3-5.79a1 1 0 0 0-.09-1.1L13 2Z" fill="#818CF8"/>
        <path d="M13 2v17H7l-3-5.79a1 1 0 0 1 .09-1.1L13 2Z" fill="#4F46E5"/>
        <line x1="8" y1="19" x2="8" y2="22" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
        <line x1="16" y1="19" x2="16" y2="22" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">InstaForm</span>
    </div>

    <p class="signin-tagline">Connect your Google account to get started.</p>
    <p class="signin-note">Your profile data stays on this device — Google is only used to identify you.</p>

    <button id="google-signin-btn" class="btn btn-google">
      <svg viewBox="0 0 24 24" width="16" height="16" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66 2.84-.62-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </button>

    <p id="signin-error" class="signin-error hidden"></p>
  </div>

  <!-- ── Main launcher (shown after authentication) ───────────────────── -->
  <div id="screen-main" class="screen hidden">

    <div class="toprow">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none">
          <path d="M13 2L4.09 12.11a1 1 0 0 0-.09 1.1L7 19h10l3-5.79a1 1 0 0 0-.09-1.1L13 2Z" fill="#818CF8"/>
          <path d="M13 2v17H7l-3-5.79a1 1 0 0 1 .09-1.1L13 2Z" fill="#4F46E5"/>
          <line x1="8" y1="19" x2="8" y2="22" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
          <line x1="16" y1="19" x2="16" y2="22" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">InstaForm</span>
      </div>
    </div>

    <!-- Profile chip -->
    <div class="profile-chip">
      <div class="chip-avatar" id="chip-avatar"></div>
      <div class="chip-info">
        <span class="chip-name"  id="chip-name"></span>
        <span class="chip-email" id="chip-email"></span>
      </div>
    </div>

    <!-- Fill button -->
    <button id="fill-btn" class="btn btn-fill">
      <svg viewBox="0 0 20 20" fill="none" width="15" height="15">
        <path d="M4 10h12M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Fill This Page
    </button>

    <p class="shortcut-hint"><kbd>Ctrl+Shift+F</kbd> works on any page</p>

    <div class="divider"></div>

    <div class="action-row">
      <button id="edit-btn" class="btn btn-secondary">
        <svg viewBox="0 0 16 16" fill="none" width="12" height="12">
          <path d="M11.7 2.3a1 1 0 0 1 1.4 0l.6.6a1 1 0 0 1 0 1.4L3.5 14.5 1 15l.5-2.5L11.7 2.3Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
        Edit Profile
      </button>
      <button id="signout-btn" class="btn btn-ghost-sm">Sign out</button>
    </div>

  </div>

  <script src="../auth.js"></script>
  <script src="popup.js"></script>
</body>
</html>
