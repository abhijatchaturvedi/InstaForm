<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>InstaForm</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">

    <div class="toprow">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none">
          <path d="M13 2L4.09 12.11a1 1 0 0 0-.09 1.1L7 19h10l3-5.79a1 1 0 0 0-.09-1.1L13 2Z" fill="#818CF8"/>
          <path d="M13 2v17H7l-3-5.79a1 1 0 0 1 .09-1.1L13 2Z" fill="#4F46E5"/>
          <line x1="8" y1="19" x2="8" y2="22" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
          <line x1="16" y1="19" x2="16" y2="22" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">InstaForm</span>
      </div>
    </div>

    <!-- Profile switcher -->
    <div class="switcher-wrap">
      <button id="switcher-btn" class="switcher-btn">
        <svg viewBox="0 0 16 16" fill="none" width="13" height="13">
          <circle cx="8" cy="6" r="3" stroke="currentColor" stroke-width="1.3"/>
          <path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <span id="active-name">Loading…</span>
        <svg viewBox="0 0 10 6" fill="none" width="10" height="6" class="chevron">
          <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </button>

      <div id="switcher-dropdown" class="switcher-dropdown hidden">
        <div id="pd-list" class="pd-list"></div>
        <div class="pd-footer">
          <button id="pd-new-btn" class="pd-new-btn">
            <svg viewBox="0 0 12 12" fill="none" width="11" height="11">
              <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            New Profile
          </button>
        </div>
      </div>
    </div>

    <!-- Fill button -->
    <button id="fill-btn" class="btn btn-fill">
      <svg viewBox="0 0 20 20" fill="none" width="15" height="15">
        <path d="M4 10h12M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Fill This Page
    </button>

    <p class="shortcut-hint"><kbd>Ctrl+Shift+F</kbd> works on any page</p>

    <div class="divider"></div>

    <button id="edit-btn" class="btn btn-secondary">
      <svg viewBox="0 0 16 16" fill="none" width="12" height="12">
        <path d="M11.7 2.3a1 1 0 0 1 1.4 0l.6.6a1 1 0 0 1 0 1.4L3.5 14.5 1 15l.5-2.5L11.7 2.3Z"
              stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
      Manage Profiles
    </button>

  </div>

  <script src="../storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
